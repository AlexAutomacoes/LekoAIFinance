<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LekoAI Test Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 24px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #0f3460; }
    .header h1 { font-size: 24px; background: linear-gradient(135deg, #4fc3f7, #7c4dff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header .last-update { font-size: 12px; color: #888; }
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: #16213e; border-radius: 12px; padding: 20px; border: 1px solid #0f3460; transition: transform 0.2s; }
    .stat-card:hover { transform: translateY(-2px); }
    .stat-card .label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .stat-card .value { font-size: 28px; font-weight: 700; margin-top: 8px; }
    .stat-card .value.erro { color: #ef5350; }
    .stat-card .value.latencia { color: #ffa726; }
    .stat-card .value.ok { color: #66bb6a; }
    .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .filter-bar .group { display: flex; gap: 4px; background: #16213e; border-radius: 8px; padding: 4px; }
    .filter-bar .group-label { font-size: 11px; color: #888; padding: 6px 8px; align-self: center; }
    .filter-btn { padding: 6px 14px; border: none; border-radius: 6px; background: transparent; color: #aaa; cursor: pointer; font-size: 13px; transition: all 0.2s; }
    .filter-btn:hover { color: #fff; background: #0f3460; }
    .filter-btn.active { background: #0f3460; color: #4fc3f7; font-weight: 600; }
    .table-container { background: #16213e; border-radius: 12px; border: 1px solid #0f3460; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #0f3460; padding: 12px 16px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #888; }
    td { padding: 12px 16px; border-top: 1px solid #1a1a2e; font-size: 14px; vertical-align: middle; }
    tr.chamado-row { cursor: pointer; transition: background 0.15s; }
    tr.chamado-row:hover td { background: rgba(79, 195, 247, 0.05); }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .badge-erro { background: rgba(239,83,80,0.15); color: #ef5350; }
    .badge-latencia { background: rgba(255,167,38,0.15); color: #ffa726; }
    .badge-melhoria { background: rgba(79,195,247,0.15); color: #4fc3f7; }
    .badge-status { background: rgba(102,187,106,0.15); color: #66bb6a; }
    .status-aberto { background: rgba(255,167,38,0.15); color: #ffa726; }
    .status-resolvido { background: rgba(102,187,106,0.15); color: #66bb6a; }
    .status-ignorado { background: rgba(158,158,158,0.15); color: #9e9e9e; }
    .actions { display: flex; gap: 6px; }
    .action-btn { padding: 4px 10px; border: none; border-radius: 6px; font-size: 11px; cursor: pointer; transition: all 0.2s; font-weight: 500; }
    .btn-resolver { background: rgba(102,187,106,0.15); color: #66bb6a; }
    .btn-resolver:hover { background: rgba(102,187,106,0.3); }
    .btn-ignorar { background: rgba(158,158,158,0.15); color: #9e9e9e; }
    .btn-ignorar:hover { background: rgba(158,158,158,0.3); }
    .btn-deletar { background: rgba(239,83,80,0.1); color: #ef5350; }
    .btn-deletar:hover { background: rgba(239,83,80,0.25); }
    .detail-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; opacity: 0; visibility: hidden; transition: all 0.3s; }
    .detail-overlay.open { opacity: 1; visibility: visible; }
    .detail-panel { position: fixed; top: 0; right: -500px; width: 500px; max-width: 90vw; height: 100%; background: #16213e; border-left: 1px solid #0f3460; z-index: 1000; transition: right 0.3s ease; display: flex; flex-direction: column; box-shadow: -4px 0 24px rgba(0,0,0,0.4); }
    .detail-panel.open { right: 0; }
    .detail-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid #0f3460; }
    .detail-header h2 { font-size: 16px; }
    .detail-close { background: none; border: none; color: #888; font-size: 24px; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
    .detail-close:hover { background: #0f3460; color: #fff; }
    .detail-body { flex: 1; overflow-y: auto; padding: 24px; }
    .detail-field { margin-bottom: 20px; }
    .detail-field .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 6px; }
    .detail-field .field-value { font-size: 14px; color: #e0e0e0; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .detail-field .field-value.description-box { background: #1a1a2e; border: 1px solid #0f3460; border-radius: 8px; padding: 16px; font-family: 'Consolas', monospace; font-size: 13px; max-height: 300px; overflow-y: auto; }
    .detail-actions { padding: 20px 24px; border-top: 1px solid #0f3460; display: flex; gap: 10px; }
    .detail-actions .action-btn { padding: 10px 20px; font-size: 13px; border-radius: 8px; }
    .detail-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .resolution-box { background: rgba(102,187,106,0.08); border: 1px solid rgba(102,187,106,0.2); border-radius: 8px; padding: 12px 16px; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 12px 20px; font-size: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); opacity: 0; transition: all 0.3s ease; z-index: 2000; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .empty-state { text-align: center; padding: 60px 20px; color: #666; }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state p { font-size: 16px; }
    .setup-banner { background: rgba(255,167,38,0.1); border: 1px solid rgba(255,167,38,0.3); border-radius: 8px; padding: 16px; margin-bottom: 20px; font-size: 13px; color: #ffa726; display: none; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .token-btn { padding: 6px 12px; border: 1px solid #0f3460; border-radius: 8px; background: #16213e; color: #9e9e9e; font-size: 12px; cursor: pointer; transition: all 0.2s; }
    .token-btn:hover { color: #fff; border-color: #4fc3f7; }
    .token-btn.unlocked { color: #66bb6a; border-color: rgba(102,187,106,0.4); }
    body.readonly .btn-resolver, body.readonly .btn-ignorar, body.readonly .btn-deletar { opacity: 0.45; }
    @media (max-width: 768px) { body { padding: 12px; } .stats-row { grid-template-columns: repeat(2, 1fr); } .detail-panel { width: 100%; max-width: 100%; } }
  </style>
</head>
<body>
  <div class="header">
    <h1>🧪 LekoAI Test Dashboard</h1>
    <div class="header-right">
      <button class="token-btn" id="tokenBtn" title="Token de escrita (fica so neste navegador)">🔒 Somente leitura</button>
      <span class="last-update" id="lastUpdate">Carregando...</span>
    </div>
  </div>
  <div class="setup-banner" id="setupBanner"></div>
  <div class="stats-row">
    <div class="stat-card"><div class="label">Total Chamados</div><div class="value" id="statTotal">-</div></div>
    <div class="stat-card"><div class="label">Erros Abertos</div><div class="value erro" id="statErros">-</div></div>
    <div class="stat-card"><div class="label">Latencia Media</div><div class="value latencia" id="statLatencia">-</div></div>
    <div class="stat-card"><div class="label">Ultimo Teste</div><div class="value ok" id="statUltimo">-</div></div>
  </div>
  <div class="filter-bar">
    <div class="group"><span class="group-label">Tipo:</span>
      <button class="filter-btn active" data-filter="type" data-value="">Todos</button>
      <button class="filter-btn" data-filter="type" data-value="erro">Erro</button>
      <button class="filter-btn" data-filter="type" data-value="latencia">Latencia</button>
      <button class="filter-btn" data-filter="type" data-value="melhoria">Melhoria</button>
      <button class="filter-btn" data-filter="type" data-value="status">Status</button>
    </div>
    <div class="group"><span class="group-label">Status:</span>
      <button class="filter-btn active" data-filter="status" data-value="">Todos</button>
      <button class="filter-btn" data-filter="status" data-value="aberto">Aberto</button>
      <button class="filter-btn" data-filter="status" data-value="resolvido">Resolvido</button>
      <button class="filter-btn" data-filter="status" data-value="ignorado">Ignorado</button>
    </div>
  </div>
  <div class="table-container">
    <table><thead><tr><th>Tipo</th><th>Titulo</th><th>Teste</th><th>Latencia</th><th>Status</th><th>Data</th><th>Acoes</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none;"><div class="icon">✅</div><p>Nenhum chamado encontrado. Tudo limpo!</p></div>
  </div>
  <div class="detail-overlay" id="detailOverlay" onclick="closeDetail()"></div>
  <div class="detail-panel" id="detailPanel">
    <div class="detail-header"><h2 id="detailTitle">Chamado</h2><button class="detail-close" onclick="closeDetail()">&times;</button></div>
    <div class="detail-body" id="detailBody"></div>
    <div class="detail-actions" id="detailActions"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    // ====== CONFIGURACAO ======
    // NAO existe chave do Supabase aqui, de proposito. O dashboard fala apenas
    // com /api/chamados, que roda no servidor e usa a chave secreta. A leitura
    // e aberta; a escrita exige o DASHBOARD_TOKEN, que fica guardado somente no
    // localStorage deste navegador e nunca no codigo-fonte da pagina.
    const API = '/api/chamados';
    const TOKEN_KEY = 'lekoai_dashboard_token';
    // ==========================

    let filters = { type: '', status: '' };
    let chamadosCache = [];

    // ---------- token de escrita ----------
    function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
    function setToken(v) {
      if (v) localStorage.setItem(TOKEN_KEY, v); else localStorage.removeItem(TOKEN_KEY);
      renderTokenState();
    }
    function renderTokenState() {
      const has = !!getToken();
      const btn = document.getElementById('tokenBtn');
      btn.textContent = has ? '🔓 Escrita liberada' : '🔒 Somente leitura';
      btn.classList.toggle('unlocked', has);
      document.body.classList.toggle('readonly', !has);
    }
    function promptToken() {
      const atual = getToken();
      const v = prompt(atual ? 'Token de escrita (deixe vazio para remover):' : 'Cole o DASHBOARD_TOKEN para liberar escrita:', atual);
      if (v === null) return;
      setToken(v.trim());
      showToast(getToken() ? 'Escrita liberada neste navegador.' : 'Token removido.');
    }

    // ---------- helpers ----------
    // Escapa o que vem do banco antes de ir para innerHTML: titulo e descricao
    // sao texto livre gravado pelo CI, nao devem poder injetar HTML na pagina.
    function esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
    function fmtDate(iso) { if (!iso) return '-'; const d = new Date(iso); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
    function typeEmoji(type) { return { erro: '🔴', latencia: '🟡', melhoria: '🔵', status: '🟢' }[type] || '⚪'; }
    function showBanner(msg) {
      const b = document.getElementById('setupBanner');
      if (!msg) { b.style.display = 'none'; return; }
      b.textContent = '⚠️ ' + msg;
      b.style.display = 'block';
    }

    // ---------- acesso a API ----------
    async function apiGet(qs) {
      const r = await fetch(`${API}?${qs}`, { headers: { 'Accept': 'application/json' } });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
      return body;
    }

    async function apiWrite(payload) {
      if (!getToken()) {
        promptToken();
        if (!getToken()) throw new Error('Escrita bloqueada: nenhum token informado.');
      }
      const r = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
        body: JSON.stringify(payload),
      });
      const body = await r.json().catch(() => ({}));
      if (r.status === 401) {
        setToken('');
        throw new Error('Token rejeitado pelo servidor. Informe novamente.');
      }
      if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
      return body;
    }

    async function loadStats() {
      try {
        const s = await apiGet('action=stats');
        // O endpoint de stats devolve by_type e by_status separados; o card quer
        // o cruzamento (erro E aberto), entao usa a contagem total da listagem.
        const errosAbertos = await apiGet('type=erro&status=aberto&limit=1');

        document.getElementById('statTotal').textContent = s.total || 0;
        document.getElementById('statErros').textContent = errosAbertos.total || 0;
        document.getElementById('statLatencia').textContent = s.avg_latency_ms ? `${s.avg_latency_ms}ms` : '-';
        document.getElementById('statUltimo').textContent = s.last_run ? fmtDate(s.last_run) : 'Nunca';
        showBanner('');
      } catch (e) {
        console.error('Stats error:', e);
        showBanner('Nao foi possivel carregar as estatisticas: ' + e.message);
      }
    }

    async function loadChamados() {
      try {
        const params = new URLSearchParams({ limit: '100' });
        if (filters.type) params.set('type', filters.type);
        if (filters.status) params.set('status', filters.status);
        const res = await apiGet(params.toString());
        chamadosCache = res.data || [];

        const tbody = document.getElementById('tableBody');
        const empty = document.getElementById('emptyState');
        if (chamadosCache.length === 0) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
        empty.style.display = 'none';
        tbody.innerHTML = chamadosCache.map(c => `
          <tr class="chamado-row" onclick="openDetail(${Number(c.id)})">
            <td><span class="badge badge-${esc(c.type)}">${esc(c.type)}</span></td>
            <td>${esc(c.title)}</td>
            <td>${esc(c.test_name || '-')}</td>
            <td>${c.latency_ms ? Math.round(c.latency_ms) + 'ms' : '-'}</td>
            <td><span class="badge status-${esc(c.status)}">${esc(c.status)}</span></td>
            <td>${fmtDate(c.timestamp)}</td>
            <td class="actions" onclick="event.stopPropagation()">
              ${c.status === 'aberto' ? `<button class="action-btn btn-resolver" onclick="updateStatus(${Number(c.id)},'resolvido')">✓</button><button class="action-btn btn-ignorar" onclick="updateStatus(${Number(c.id)},'ignorado')">—</button>` : ''}
              <button class="action-btn btn-deletar" onclick="deleteChamado(${Number(c.id)})">✕</button>
            </td>
          </tr>`).join('');
      } catch (e) {
        console.error('Load error:', e);
        document.getElementById('tableBody').innerHTML = '';
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('emptyState').querySelector('p').textContent = 'Erro: ' + e.message;
      }
    }

    function openDetail(id) {
      const c = chamadosCache.find(x => x.id === id); if (!c) return;
      document.getElementById('detailTitle').textContent = `${typeEmoji(c.type)} Chamado #${c.id}`;
      let html = `
        <div class="detail-meta">
          <div class="detail-field"><div class="field-label">Tipo</div><div class="field-value"><span class="badge badge-${esc(c.type)}">${esc(c.type)}</span></div></div>
          <div class="detail-field"><div class="field-label">Status</div><div class="field-value"><span class="badge status-${esc(c.status)}">${esc(c.status)}</span></div></div>
          <div class="detail-field"><div class="field-label">Teste</div><div class="field-value">${esc(c.test_name || 'N/A')}</div></div>
          <div class="detail-field"><div class="field-label">Latencia</div><div class="field-value">${c.latency_ms ? Math.round(c.latency_ms) + 'ms' : 'N/A'}</div></div>
        </div>
        <div class="detail-field"><div class="field-label">Titulo</div><div class="field-value" style="font-size:16px;font-weight:600;">${esc(c.title)}</div></div>
        <div class="detail-field"><div class="field-label">Descricao / Detalhes</div><div class="field-value description-box">${esc(c.description || 'Sem descricao.')}</div></div>
        <div class="detail-meta">
          <div class="detail-field"><div class="field-label">Criado em</div><div class="field-value">${fmtDate(c.created_at)}</div></div>
          <div class="detail-field"><div class="field-label">Timestamp</div><div class="field-value">${fmtDate(c.timestamp)}</div></div>
        </div>`;
      if (c.resolution_note) html += `<div class="detail-field"><div class="field-label">Nota de resolucao</div><div class="field-value resolution-box">${esc(c.resolution_note)}</div></div>`;
      document.getElementById('detailBody').innerHTML = html;
      let act = c.status === 'aberto' ? `<button class="action-btn btn-resolver" onclick="updateStatus(${Number(c.id)},'resolvido');closeDetail();">✓ Resolver</button><button class="action-btn btn-ignorar" onclick="updateStatus(${Number(c.id)},'ignorado');closeDetail();">— Ignorar</button>` : '';
      act += `<button class="action-btn btn-deletar" onclick="deleteChamado(${Number(c.id)});closeDetail();">✕ Deletar</button>`;
      document.getElementById('detailActions').innerHTML = act;
      document.getElementById('detailOverlay').classList.add('open');
      document.getElementById('detailPanel').classList.add('open');
    }
    function closeDetail() { document.getElementById('detailOverlay').classList.remove('open'); document.getElementById('detailPanel').classList.remove('open'); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

    async function updateStatus(id, status) {
      const note = prompt(`Nota (opcional) para "${status}":`);
      if (note === null) return;  // cancelou o prompt: nao altera nada
      try {
        await apiWrite({ _method: 'PATCH', id, status, resolution_note: note || '' });
        showToast(`Chamado #${id} → ${status}`); refresh();
      } catch (e) { showToast('Erro: ' + e.message); }
    }

    async function deleteChamado(id) {
      if (!confirm('Deletar este chamado?')) return;
      try {
        await apiWrite({ _method: 'DELETE', id });
        showToast(`Chamado #${id} removido`); refresh();
      } catch (e) { showToast('Erro: ' + e.message); }
    }

    function refresh() { loadStats(); loadChamados(); document.getElementById('lastUpdate').textContent = `Atualizado: ${new Date().toLocaleTimeString('pt-BR')}`; }
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => { filters[btn.dataset.filter] = btn.dataset.value; btn.closest('.group').querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); loadChamados(); });
    });
    document.getElementById('tokenBtn').addEventListener('click', promptToken);

    // Init
    renderTokenState();
    refresh();
    setInterval(refresh, 60000);
  </script>
</body>
</html>
