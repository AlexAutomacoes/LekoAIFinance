[project]
name = "lekoaifinance"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "supabase==2.31.0",
    "python-telegram-bot==22.7",
    "python-dotenv",
    "groq==1.4.0",
    "fpdf2==2.8.5",
    "httpx",
    "openpyxl",
    "tzdata",
]

# Nao ha pacote Python para buildar (apenas funcoes serverless + scripts);
# impede o uv de tentar instalar o proprio projeto como um pacote.
[tool.uv]
package = false

# A Vercel (runtime Python atual) exige UM entrypoint explicito. Como so pode
# haver um, api/telegram.py e o entrypoint unico e despacha internamente:
#   /api/chamados*  -> servico de chamados (tools/chamados_service.py)
#   restante        -> webhook do Telegram
[tool.vercel]
entrypoint = "api.telegram:handler"
